[package]
name = "splicer-tool-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Elizabeth Gilbert"]
description = "Rust SDK for building splicer middleware and downstream tools."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ejrgilbert/splicer"
keywords = ["wasm", "WebAssembly", "components", "splicer"]
categories = ["wasm"]
# Internal-only until tier-3 lands and the SDK contract has firmed up.
# Flip to `publish = true` (or remove this line) when ready to ship to
# crates.io.
publish = false

[workspace]

[dependencies]
wasm-wave = { version = "=0.249", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

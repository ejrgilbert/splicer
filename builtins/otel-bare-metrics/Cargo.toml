[package]
name = "otel-bare-metrics"
version = "0.2.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.51.0", features = ["default", "async-spawn", "inter-task-wakeup", "async"] }

[build-dependencies]
builtin-manifest = { package = "splicer-builtin-manifest", path = "../builtin-manifest", version = "0.1.0" }

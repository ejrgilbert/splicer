[package]
name = "hello-tier2"
version = "0.1.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.51.0", features = ["default", "async-spawn", "inter-task-wakeup", "async"] }
splicer-tool-sdk = { path = "../../splicer-tool-sdk" }

[build-dependencies]
builtin-manifest = { path = "../builtin-manifest" }

[builtin]
description = "Record every wrapped call's lifted args + result as a binary stream of typed field-trees. Wire format: splicer-tool-sdk/wire-format.md."

[[key]]
name = "sink"
type = "enum { stdout, stderr }"
case_insensitive = true
default = "stdout"
doc = "Which standard stream binary frames are appended to. Use `stderr` when the wrapped component itself prints structured output on stdout (the recorder stream needs its own channel to parse)."

[package]
name = "hello-tier4"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so the main `cargo build` of splicer doesn't
# try to build this for the host target — splicer's stage-3 codegen
# generates a wrapper crate that consumes this as a path dep.
[workspace]

[lib]

[dependencies]
splicer-tool-sdk = { path = "../../splicer-tool-sdk" }

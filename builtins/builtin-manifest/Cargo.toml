[package]
name = "builtin-manifest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared schema + build.rs codegen for splicer builtin manifests."

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wasmparser = "0.247.0"
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
wasm-wave = { version = "0.247.0", default-features = false, features = ["std"] }

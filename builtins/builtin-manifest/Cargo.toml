[package]
name = "splicer-builtin-manifest"
version = "0.1.0"
edition = "2021"
authors = ["Elizabeth Gilbert"]
description = "Internal crate for splicer. Shared schema + build.rs codegen for builtin middleware manifests; not intended for use outside the splicer ecosystem."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ejrgilbert/splicer"
categories = ["wasm"]
keywords = ["wasm", "WebAssembly", "splicer"]

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wasmparser = "0.247.0"
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
wasm-wave = { version = "0.247.0", default-features = false, features = ["std"] }

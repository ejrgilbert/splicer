[package]
name = "splicer"
version = "2.4.1"
edition = "2021"
authors = ["Elizabeth Gilbert"]
description = "Plan and generate middleware splice operations for WebAssembly component composition graphs."
license = "Apache-2.0"

readme = "README.md"
repository = "https://github.com/ejrgilbert/splicer"
categories = ["wasm"]
keywords = ["wasm", "WebAssembly", "components", "composition"]

[[bin]]
doc = false
name = "splicer"
path = "src/main.rs"

[lib]
name = "splicer"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "wac_compose"
path = "examples/wac_compose.rs"

[dependencies]
colored = "3.1.1"
cviz = "2.0.4"
#cviz = { path = "../cviz" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
globset = "0.4.18"
anyhow = "1.0.86"
semver = "1"
clap = { version = "4.5.58", features = ["derive"] }
wasmparser = "0.247.0"
wasm-encoder = { version = "0.247.0", features = ["wasmparser"] }
wit-parser = "0.247"
wit-bindgen-core = "0.57.1"
wit-bindgen-rust = "0.57.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wirm = "5.0.0"
#wirm = { path = "../../research/compilers/wirm" }
wit-component = "0.247"
oci-client = { version = "0.16", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
wac-parser = "0.10"
wac-resolver = "0.10"
wac-graph = "0.10"
tempfile = "3"
builtin-protocol = { package = "splicer-builtin-protocol", path = "builtins/builtin-protocol", version = "0.2.0" }
toml = "0.8"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
heck = "0.5"
include_dir = "0.7"

[build-dependencies]
toml = "0.8"

[dev-dependencies]
wat = "1"
arbitrary = "1"
wit-component = { version = "0.247", features = ["dummy-module"] }
wasmtime = { version = "44", features = ["component-model", "component-model-async", "async"] }
wasmtime-wasi = "44"
tokio = { version = "1", features = ["rt", "macros"] }

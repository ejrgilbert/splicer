name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: splicer-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: splicer-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/splicer dist/${{ matrix.artifact_name }} || \
          cp target/${{ matrix.target }}/release/splicer.exe dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Login to crates.io
        run: cargo login ${{ secrets.CRATES_API_TOKEN }}

      # splicer depends on builtin-manifest as a path+version dep. crates.io
      # needs the listed version to exist before splicer can resolve. Publish
      # builtin-manifest first; tolerate "already uploaded" so re-running this
      # workflow against a tag that didn't bump builtin-manifest's version
      # doesn't fail the release.
      - name: Publish builtin-manifest (if version not yet on crates.io)
        working-directory: builtins/builtin-manifest
        run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee /tmp/builtin-manifest-publish.log; then
            echo "builtin-manifest published"
          elif grep -qE "already (uploaded|exists)|crate version .* is already" /tmp/builtin-manifest-publish.log; then
            echo "builtin-manifest version already on crates.io -- skipping"
          else
            echo "::error::builtin-manifest publish failed for an unexpected reason"
            exit 1
          fi

      - name: Publish splicer
        run: cargo publish --locked

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: splicer-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: splicer-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/splicer dist/${{ matrix.artifact_name }} || \
          cp target/${{ matrix.target }}/release/splicer.exe dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Login to crates.io
        run: cargo login ${{ secrets.CRATES_API_TOKEN }}

      # splicer depends on splicer-builtin-protocol as a path+version dep.
      # crates.io needs the listed version to exist before splicer can
      # resolve. Publish builtin-protocol first; tolerate "already uploaded"
      # so re-running this workflow against a tag that didn't bump
      # builtin-protocol's version doesn't fail the release.
      - name: Publish splicer-builtin-protocol (if version not yet on crates.io)
        working-directory: builtins/builtin-protocol
        run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee /tmp/builtin-protocol-publish.log; then
            echo "builtin-protocol published"
          elif grep -qE "already (uploaded|exists)|crate version .* is already" /tmp/builtin-protocol-publish.log; then
            echo "builtin-protocol version already on crates.io -- skipping"
          else
            echo "::error::builtin-protocol publish failed for an unexpected reason"
            exit 1
          fi

      # splicer's typed-codegen pipeline synthesizes wrapper crates that
      # depend on splicer-tool-sdk. Same idempotent shape as the
      # protocol step above.
      - name: Publish splicer-tool-sdk (if version not yet on crates.io)
        working-directory: splicer-tool-sdk
        run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee /tmp/splicer-tool-sdk-publish.log; then
            echo "splicer-tool-sdk published"
          elif grep -qE "already (uploaded|exists)|crate version .* is already" /tmp/splicer-tool-sdk-publish.log; then
            echo "splicer-tool-sdk version already on crates.io -- skipping"
          else
            echo "::error::splicer-tool-sdk publish failed for an unexpected reason"
            exit 1
          fi

      # Each leaf Cargo.toml under builtins/ (except builtin-protocol,
      # a real crates.io dep) triggers cargo's nested-package skip and
      # gets the whole dir stripped from splicer's tarball. Rename
      # transiently so build.rs can still read each dir at install
      # time. Runner is ephemeral; no cleanup needed.
      - name: Hide nested builtin Cargo.tomls from cargo publish
        run: |
          set -euo pipefail
          for d in builtins/*/; do
            [ "$d" = "builtins/builtin-protocol/" ] && continue
            [ -f "${d}Cargo.toml" ] && mv "${d}Cargo.toml" "${d}Cargo.toml.embed"
          done

      - name: Publish splicer
        run: cargo publish --locked

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
